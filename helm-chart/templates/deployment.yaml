apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microservice.fullname" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "microservice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "microservice.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "microservice.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
              - ALL
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            {{- if .Values.database.postgresql.host }}
            - name: RETAIL_ORDERS_PERSISTENCE_ENDPOINT
              value: "{{ .Values.database.postgresql.host }}:5432"
            - name: RETAIL_ORDERS_PERSISTENCE_NAME
              value: {{ .Values.database.postgresql.database | quote }}
            - name: RETAIL_ORDERS_PERSISTENCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "microservice.fullname" . }}-db-secret
                  key: postgresql-username
            - name: RETAIL_ORDERS_PERSISTENCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "microservice.fullname" . }}-db-secret
                  key: postgresql-password
            {{- end }}
            {{- if .Values.database.mysql.host }}
            - name: RETAIL_CATALOG_PERSISTENCE_ENDPOINT
              value: "{{ .Values.database.mysql.host }}:3306"
            - name: RETAIL_CATALOG_PERSISTENCE_NAME
              value: {{ .Values.database.mysql.database | quote }}
            - name: RETAIL_CATALOG_PERSISTENCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "microservice.fullname" . }}-db-secret
                  key: mysql-username
            - name: RETAIL_CATALOG_PERSISTENCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "microservice.fullname" . }}-db-secret
                  key: mysql-password
            {{- end }}
            {{- if .Values.database.redis.host }}
            - name: REDIS_HOST
              value: {{ .Values.database.redis.host | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "microservice.fullname" . }}-db-secret
                  key: redis-password
            - name: RETAIL_CHECKOUT_PERSISTENCE_REDIS_URL
              value: "redis://{{ .Values.database.redis.host }}:6379"
            {{- end }}
            {{- if and .Values.database.dynamodb .Values.database.dynamodb.enabled }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.aws.region | default "us-east-1" | quote }}
            {{- end }}
            {{- range .Values.app.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.app.healthPath }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.app.readyPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}