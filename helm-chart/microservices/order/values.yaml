serviceName: "order"
namespace: "retail-store"
replicaCount: 1

image:
  repository: public.ecr.aws/aws-containers/retail-store-sample-orders
  tag: "1.2.4"

app:
  port: 8080
  healthPath: "/actuator/health"
  readyPath: "/actuator/health"
  env:
    - name: SERVER_TOMCAT_ACCESSLOG_ENABLED
      value: "true"
    - name: RETAIL_ORDERS_PERSISTENCE_PROVIDER
      value: "postgres"

service:
  port: 80

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

database:
  postgresql:
    host: ""
    username: ""
    password: ""
    database: "orders"

# IRSA Configuration
irsa:
  enabled: true
  roleArn: ""  # Will be set via --set during deployment